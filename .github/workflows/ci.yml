name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # leaklog-test / livelog-test exigent `age` (chiffrement du journal) ; sans lui ils
      # échouent en « age absent ». Même binaire épinglé + sha256 que le workflow FullRun.
      - name: Installer age (épinglé, sha256 vérifié)
        env:
          AGE_VERSION: "1.2.1"
          AGE_SHA256: "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50"
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/age.tgz"
          curl -sSfL -o "$f" "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $f" | sha256sum -c --quiet
          tar -xzf "$f" -C "$RUNNER_TEMP" age/age age/age-keygen
          sudo install -m 0755 "$RUNNER_TEMP/age/age" /usr/local/bin/age
          sudo install -m 0755 "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/age-keygen
          age --version
      - name: Tests opencode
        run: |
          set -euo pipefail
          failed=0
          for t in opencode/tests/*.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "ok $t"
            else
              echo "::error::$t a échoué"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks detect (épinglé, sha256 vérifié)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/gitleaks.tgz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c --quiet
          tar -xzf "$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --verbose
